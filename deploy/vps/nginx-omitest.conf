server {
    listen 80;
    server_name omitest.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name omitest.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/omitest.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omitest.example.com/privkey.pem;

    # Safe browser hardening for the Streamlit UI. A restrictive CSP is not
    # included here because Streamlit needs inline scripts and WebSockets;
    # deploy a tested nonce-based policy if you customize the frontend.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    auth_basic "omitest";
    auth_basic_user_file /etc/nginx/.htpasswd-omitest;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
